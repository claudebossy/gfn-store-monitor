name: Update GitHub Pages Data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Track Instant Gaming prices
        run: |
          python instant_gaming_monitor.py

      - name: Build GFN x PC Game Pass catalog
        run: |
          python gfn_xbox_game_pass_catalog.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/instant-gaming-price-history.json
          git add site/data/gfn-xbox-pc-game-pass-catalog.json
          git add site/data/howlongtobeat-cache.json
          git add site/data/opencritic-cache.json

          if git diff --cached --quiet; then
            echo "No Pages data changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub Pages data"
          git push

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
