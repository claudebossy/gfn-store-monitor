name: Monitor HBO Max Availability

on:
  schedule:
    # Run every 6 hours and stay staggered ahead of the
    # other history-writing workflows to avoid push races.
    - cron: "11 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hbo-max-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check HBO Max
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python is_on_hbo.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/hbo-max-history.json

          if git diff --cached --quiet; then
            echo "No HBO history changes to commit."
            exit 0
          fi

          git commit -m "Update HBO Max history"
          git push
