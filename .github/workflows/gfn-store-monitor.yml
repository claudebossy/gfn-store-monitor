name: Monitor GeForce NOW Store Availability

on:
  schedule:
    # Run every 6 hours.
    #
    # 17 is intentional rather than exactly on the hour,
    # which avoids unnecessarily coinciding with many scheduled jobs.
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gfn-store-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check GeForce NOW
        env:
          GFN_COUNTRY: CH
          GFN_LANGUAGE: en_US

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python gfn_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog_state.json state.json
          git add site/data/gfn-catalog-history.json

          if git diff --cached --quiet; then
            echo "No persisted state files changed."
            exit 0
          fi

          git commit -m "Update GFN store monitor state"
          git push