<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>GFN x PC Game Pass catalog</title>
    <style>
      :root {
        color-scheme: light;
        --bg-top: #fff8fb;
        --bg-bottom: #eff6ff;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: rgba(255, 251, 255, 0.92);
        --panel-border: rgba(192, 181, 214, 0.52);
        --text: #25324a;
        --muted: #61708a;
        --accent: #7c8cff;
        --accent-strong: #5b6fe7;
        --accent-soft: rgba(186, 200, 255, 0.52);
        --accent-soft-strong: rgba(255, 210, 232, 0.42);
        --success: #3d8b71;
        --warning: #b7791f;
        --shadow: rgba(155, 171, 203, 0.22);
        --tag: rgba(255, 244, 249, 0.9);
        --tag-border: rgba(204, 184, 214, 0.58);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(191, 219, 254, 0.72) 0, transparent 30%),
          radial-gradient(circle at top right, rgba(253, 230, 138, 0.34) 0, transparent 26%),
          radial-gradient(circle at center, rgba(244, 208, 255, 0.22) 0, transparent 34%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      }

      a {
        color: inherit;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero,
      .panel,
      .game-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        box-shadow: 0 22px 46px var(--shadow);
        backdrop-filter: blur(14px);
      }

      .hero {
        padding: 24px;
        margin-bottom: 20px;
        background:
          linear-gradient(135deg, rgba(196, 181, 253, 0.34), rgba(253, 205, 232, 0.28)),
          var(--panel-strong);
      }

      .hero-header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      p {
        color: var(--muted);
      }

      .hero p {
        max-width: 820px;
        margin-top: 10px;
      }

      .pill-link,
      button,
      select,
      input[type="search"] {
        border-radius: 999px;
        border: 1px solid var(--panel-border);
        color: var(--text);
        background: rgba(255, 255, 255, 0.86);
      }

      .pill-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        text-decoration: none;
      }

      .meta {
        margin-top: 14px;
        font-size: 0.95rem;
      }

      .summary-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        margin-top: 20px;
      }

      .summary-card {
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 249, 253, 0.86);
        border: 1px solid rgba(201, 190, 245, 0.48);
      }

      .summary-card strong {
        display: block;
        font-size: 1.7rem;
        margin-top: 8px;
      }

      .toolbar {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1.7fr) repeat(2, minmax(180px, 1fr));
      }

      .panel {
        padding: 18px;
        margin-bottom: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      input[type="search"],
      select {
        width: 100%;
        padding: 12px 14px;
        outline: none;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 28px;
      }

      .toggle-row input {
        accent-color: var(--accent-strong);
      }

      .results-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .games-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }

      .game-card {
        overflow: hidden;
      }

      .cover {
        aspect-ratio: 16 / 9;
        background:
          linear-gradient(135deg, rgba(191, 219, 254, 0.82), rgba(253, 205, 232, 0.52)),
          rgba(255, 247, 251, 0.92);
      }

      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-body {
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      .card-title {
        display: grid;
        gap: 6px;
      }

      .card-title small,
      .subtitle,
      .empty-state,
      .error-state {
        color: var(--muted);
      }

      .tag-list,
      .action-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tag {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.82rem;
        background: var(--tag);
        border: 1px solid var(--tag-border);
      }

      .tag.success {
        color: var(--success);
        border-color: rgba(61, 139, 113, 0.28);
      }

      .tag.warning {
        color: var(--warning);
        border-color: rgba(183, 121, 31, 0.28);
      }

      .hltb-card {
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(250, 244, 255, 0.92);
        border: 1px solid rgba(201, 190, 245, 0.48);
      }

      .hltb-card strong {
        display: block;
        font-size: 1rem;
        margin-top: 4px;
      }

      .hltb-meta {
        display: grid;
        gap: 4px;
      }

      .action-row a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid var(--panel-border);
        background: linear-gradient(
          135deg,
          var(--accent-soft),
          var(--accent-soft-strong)
        );
      }

      .empty-state,
      .error-state {
        padding: 18px;
        border-radius: 16px;
        background: rgba(255, 252, 255, 0.88);
        border: 1px dashed var(--panel-border);
      }

      @media (max-width: 1100px) {
        .toolbar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 720px) {
        main {
          padding: 16px;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }

        .toggle-row {
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero-header">
          <div>
            <h1>GeForce NOW x PC Game Pass catalog</h1>
            <p>
              Browse PC Game Pass games that are already on GeForce NOW
              or still missing from it, then sort them by short-game fit.
            </p>
          </div>
          <div class="action-row">
            <a class="pill-link" href="./index.html">
              Instant Gaming tracker
            </a>
            <a class="pill-link" href="./monitor-history.html">
              Monitor history
            </a>
          </div>
        </div>
        <p class="meta" id="generated-at">Loading catalog snapshot...</p>
        <div class="summary-grid" id="summary"></div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <div class="field">
            <label for="search">Search</label>
            <input
              id="search"
              type="search"
              placeholder="Search title, publisher, or developer"
            />
          </div>
          <div class="field">
            <label for="catalog-view">Catalog view</label>
            <select id="catalog-view">
              <option value="intersection">On GeForce NOW + PC Game Pass</option>
              <option value="xbox-only">On PC Game Pass, not on GFN</option>
            </select>
          </div>
          <div class="field">
            <label for="gfn-xbox-filter">GFN Xbox store</label>
            <select id="gfn-xbox-filter">
              <option value="all">All overlap titles</option>
              <option value="xbox-store">Playable with GFN Xbox store</option>
              <option value="non-xbox-store">Not playable with GFN Xbox store</option>
            </select>
          </div>
          <div class="field">
            <label for="sort-order">Sort</label>
            <select id="sort-order">
              <option value="short-score">Best short-game fit</option>
              <option value="title">Title A-Z</option>
              <option value="release">Newest release</option>
            </select>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="results-header">
          <div>
            <h2>Catalog</h2>
            <p id="results-meta">Loading games...</p>
          </div>
        </div>
        <div class="games-grid" id="games"></div>
      </section>
    </main>

    <script>
      const DATA_URL = "./data/gfn-xbox-pc-game-pass-catalog.json";

      let catalogData = null;

      function formatTimestamp(value) {
        return new Date(value).toLocaleString();
      }

      function formatDate(value) {
        if (!value) {
          return "Unknown release date";
        }

        return new Date(value).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric"
        });
      }

      function formatDuration(value) {
        if (!Number.isFinite(value) || value <= 0) {
          return "N/A";
        }

        const totalHours = value / 3600;

        if (totalHours >= 100) {
          return Math.round(totalHours) + "h";
        }

        if (totalHours >= 10) {
          return totalHours.toFixed(1).replace(/\.0$/, "") + "h";
        }

        return totalHours.toFixed(1) + "h";
      }

      function formatScore(value) {
        if (!Number.isFinite(value) || value <= 0) {
          return "N/A";
        }

        if (value >= 100 || Number.isInteger(value)) {
          return Math.round(value);
        }

        return value.toFixed(1).replace(/\.0$/, "");
      }

      function normalizeText(value) {
        return String(value || "").toLowerCase();
      }

      function syncFilters() {
        const catalogView =
          document.getElementById("catalog-view").value || "intersection";
        const gfnXboxFilter = document.getElementById("gfn-xbox-filter");
        const isIntersectionView = catalogView === "intersection";

        gfnXboxFilter.disabled = !isIntersectionView;

        if (!isIntersectionView) {
          gfnXboxFilter.value = "all";
        }
      }

      function renderGeneratedAt() {
        const generatedAt = document.getElementById("generated-at");

        if (!catalogData) {
          generatedAt.textContent = "The catalog data is not available yet.";
          return;
        }

        generatedAt.textContent =
          "Last update: " +
          formatTimestamp(catalogData.generated_at) +
          " · GFN " +
          catalogData.gfn_country +
          " / Xbox " +
          catalogData.xbox_market;
      }

      function renderSummary() {
        const summary = document.getElementById("summary");
        const counts = catalogData.counts;
        const details = catalogData.summary;

        const cards = [
          ["Catalog titles", counts.catalog_titles],
          ["On GeForce NOW", counts.intersection_titles],
          ["PC Game Pass only", counts.xbox_only_titles],
          ["HowLongToBeat data", details.hltb_matches],
          ["OpenCritic data", details.opencritic_matches],
          ["Short-game scores", details.short_game_score_matches]
        ];

        summary.innerHTML = cards
          .map(
            ([label, value]) => `
              <article class="summary-card">
                <p>${label}</p>
                <strong>${value}</strong>
              </article>
            `
          )
          .join("");
      }

      function getFilteredGames() {
        const searchValue = normalizeText(
          document.getElementById("search").value
        );
        const catalogView =
          document.getElementById("catalog-view").value || "intersection";
        const gfnXboxFilter =
          document.getElementById("gfn-xbox-filter").value || "all";
        const sortOrder =
          document.getElementById("sort-order").value || "short-score";

        let games = (catalogData.games || []).filter((game) => {
          if (game.catalog_group !== catalogView) {
            return false;
          }

          if (catalogView === "intersection") {
            if (gfnXboxFilter === "xbox-store" && !game.gfn_has_xbox_store) {
              return false;
            }

            if (
              gfnXboxFilter === "non-xbox-store" &&
              game.gfn_has_xbox_store
            ) {
              return false;
            }
          }

          if (!searchValue) {
            return true;
          }

          const haystack = [
            game.title,
            game.xbox_title,
            game.publisher,
            game.developer
          ]
            .filter(Boolean)
            .join(" ");

          return normalizeText(haystack).includes(searchValue);
        });

        games.sort((left, right) => {
          if (sortOrder === "short-score") {
            const leftScore = left.short_game_score?.score;
            const rightScore = right.short_game_score?.score;

            if (Number.isFinite(leftScore) || Number.isFinite(rightScore)) {
              if (!Number.isFinite(leftScore)) {
                return 1;
              }

              if (!Number.isFinite(rightScore)) {
                return -1;
              }

              if (rightScore !== leftScore) {
                return rightScore - leftScore;
              }
            }
          }

          if (sortOrder === "release") {
            return (
              new Date(right.release_date || 0).getTime() -
              new Date(left.release_date || 0).getTime()
            );
          }

          return left.title.localeCompare(right.title);
        });

        return games;
      }

      function renderGames() {
        const games = getFilteredGames();
        const gamesRoot = document.getElementById("games");
        const resultsMeta = document.getElementById("results-meta");
        const catalogView =
          document.getElementById("catalog-view").value || "intersection";
        const gfnXboxFilter =
          document.getElementById("gfn-xbox-filter").value || "all";
        let totalForView;
        let viewLabel;

        if (catalogView === "intersection") {
          if (gfnXboxFilter === "xbox-store") {
            totalForView = catalogData.summary.gfn_xbox_store_matches;
            viewLabel =
              "overlap titles with the GFN Xbox store available";
          } else if (gfnXboxFilter === "non-xbox-store") {
            totalForView =
              catalogData.counts.intersection_titles -
              catalogData.summary.gfn_xbox_store_matches;
            viewLabel =
              "overlap titles without GFN Xbox store support";
          } else {
            totalForView = catalogData.counts.intersection_titles;
            viewLabel =
              "titles on both GeForce NOW and PC Game Pass";
          }
        } else {
          totalForView = catalogData.counts.xbox_only_titles;
          viewLabel =
            "PC Game Pass titles not currently on GeForce NOW";
        }

        resultsMeta.textContent =
          "Showing " +
          games.length +
          " of " +
          totalForView +
          " " +
          viewLabel +
          ".";

        if (!games.length) {
          gamesRoot.innerHTML =
            '<div class="empty-state">No games match the current filters.</div>';
          return;
        }

        gamesRoot.innerHTML = games
          .map((game) => {
            const subtitle =
              game.xbox_title && game.xbox_title !== game.title
                ? `<small>${game.xbox_title}</small>`
                : "";

            const description = game.description
              ? `<p class="subtitle">${game.description}</p>`
              : "";

            const image = game.image_url
              ? `<img src="${game.image_url}" alt="${game.title}" loading="lazy" />`
              : "";

            const availabilityTags =
              game.catalog_group === "intersection"
                ? `
                    <span class="tag success">On GeForce NOW</span>
                    ${
                      game.gfn_has_xbox_store
                        ? '<span class="tag success">GFN Xbox store</span>'
                        : ""
                    }
                  `
                : '<span class="tag warning">PC Game Pass only</span>';

            const publisher = game.publisher
              ? `<p>Publisher: ${game.publisher}</p>`
              : "";
            const developer = game.developer
              ? `<p>Developer: ${game.developer}</p>`
              : "";
            const hltb = game.howlongtobeat;
            const opencritic = game.opencritic;
            const shortGameScore = game.short_game_score;
            const shortGameMarkup = shortGameScore
              ? `
                  <div class="hltb-card">
                    <p>Short-game score</p>
                    <strong>${formatScore(shortGameScore.score)}</strong>
                  </div>
                  <div class="subtitle hltb-meta">
                    <p>Blend: 70% critics + 30% time fit</p>
                    <p>OpenCritic: ${formatScore(shortGameScore.critic_score)}</p>
                    <p>
                      Main story: ${formatScore(shortGameScore.main_story_hours)}h
                      · fit ${formatScore(shortGameScore.duration_fit_score)}/100
                    </p>
                  </div>
                `
              : '<p class="subtitle">Short-game score unavailable.</p>';
            const hltbMarkup = hltb
              ? `
                  <div class="hltb-card">
                    <p>Main story</p>
                    <strong>${formatDuration(hltb.main_story_seconds)}</strong>
                  </div>
                  <div class="subtitle hltb-meta">
                    <p>HowLongToBeat match: ${hltb.title}</p>
                    ${
                      hltb.completion_count
                        ? `<p>Community entries: ${hltb.completion_count}</p>`
                        : ""
                    }
                    ${
                      hltb.review_score
                        ? `<p>Review score: ${hltb.review_score}</p>`
                        : ""
                    }
                  </div>
                `
              : '<p class="subtitle">HowLongToBeat data unavailable.</p>';
            const opencriticMarkup = opencritic
              ? `
                  <div class="hltb-card">
                    <p>OpenCritic</p>
                    <strong>${formatScore(opencritic.top_critic_score)}</strong>
                  </div>
                  <div class="subtitle hltb-meta">
                    <p>OpenCritic match: ${opencritic.title}</p>
                    ${
                      opencritic.tier
                        ? `<p>Tier: ${opencritic.tier}</p>`
                        : ""
                    }
                    ${
                      opencritic.percent_recommended
                        ? `<p>Recommended: ${formatScore(opencritic.percent_recommended)}%</p>`
                        : ""
                    }
                    ${
                      opencritic.review_count
                        ? `<p>Reviews: ${opencritic.review_count}</p>`
                        : ""
                    }
                  </div>
                `
              : '<p class="subtitle">OpenCritic data unavailable.</p>';

            return `
              <article class="game-card">
                <div class="cover">${image}</div>
                <div class="card-body">
                  <div class="card-title">
                    <h3>${game.title}</h3>
                    ${subtitle}
                  </div>
                  ${description}
                  <div class="tag-list">
                    ${availabilityTags}
                  </div>
                  <div class="subtitle">
                    ${publisher}
                    ${developer}
                    <p>Release date: ${formatDate(game.release_date)}</p>
                  </div>
                  ${shortGameMarkup}
                  ${hltbMarkup}
                  ${opencriticMarkup}
                  <div class="action-row">
                    <a href="${game.xbox_url}" target="_blank" rel="noreferrer">
                      Open Microsoft Store
                    </a>
                    ${
                      hltb
                        ? `<a href="${hltb.url}" target="_blank" rel="noreferrer">
                             Open HowLongToBeat
                           </a>`
                        : ""
                    }
                    ${
                      opencritic
                        ? `<a href="${opencritic.url}" target="_blank" rel="noreferrer">
                            Open OpenCritic
                           </a>`
                        : ""
                    }
                  </div>
                </div>
              </article>
            `;
          })
          .join("");
      }

      async function loadCatalogData() {
        const response = await fetch(DATA_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Failed to load catalog data: ${response.status}`
          );
        }

        return response.json();
      }

      async function init() {
        try {
          catalogData = await loadCatalogData();
          renderGeneratedAt();
          renderSummary();
          syncFilters();
          renderGames();

          [
            "search",
            "catalog-view",
            "sort-order",
            "gfn-xbox-filter",
          ].forEach((id) => {
            document
              .getElementById(id)
              .addEventListener("input", renderGames);
            document
              .getElementById(id)
              .addEventListener("change", renderGames);
          });
          document
            .getElementById("catalog-view")
            .addEventListener("input", syncFilters);
          document
            .getElementById("catalog-view")
            .addEventListener("change", syncFilters);
        } catch (error) {
          document.getElementById("generated-at").textContent =
            "The catalog data is not available yet.";
          document.getElementById("summary").innerHTML = "";
          document.getElementById("games").innerHTML =
            `<div class="error-state">${error.message}</div>`;
          document.getElementById("results-meta").textContent =
            "Unable to render the catalog.";
        }
      }

      init();
    </script>
  </body>
</html>
