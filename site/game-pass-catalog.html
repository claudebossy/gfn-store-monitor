<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>GFN x PC Game Pass catalog</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-top: #0f1728;
        --bg-bottom: #09101d;
        --panel: rgba(15, 23, 42, 0.82);
        --panel-strong: rgba(17, 24, 39, 0.95);
        --panel-border: rgba(107, 114, 128, 0.32);
        --text: #ecf7ff;
        --muted: #9fb3c8;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
        --accent-soft: rgba(59, 130, 246, 0.2);
        --accent-soft-strong: rgba(125, 211, 252, 0.2);
        --success: #86efac;
        --warning: #fbbf24;
        --shadow: rgba(2, 8, 23, 0.45);
        --tag: rgba(148, 163, 184, 0.16);
        --tag-border: rgba(148, 163, 184, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(59, 130, 246, 0.22) 0, transparent 28%),
          radial-gradient(circle at top right, rgba(16, 185, 129, 0.16) 0, transparent 24%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      }

      a {
        color: inherit;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      .hero,
      .panel,
      .game-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        box-shadow: 0 22px 46px var(--shadow);
        backdrop-filter: blur(14px);
      }

      .hero {
        padding: 24px;
        margin-bottom: 20px;
        background:
          linear-gradient(135deg, rgba(14, 165, 233, 0.14), rgba(34, 197, 94, 0.08)),
          var(--panel-strong);
      }

      .hero-header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      p {
        color: var(--muted);
      }

      .hero p {
        max-width: 820px;
        margin-top: 10px;
      }

      .pill-link,
      button,
      select,
      input[type="search"] {
        border-radius: 999px;
        border: 1px solid var(--panel-border);
        color: var(--text);
        background: rgba(15, 23, 42, 0.72);
      }

      .pill-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        text-decoration: none;
      }

      .meta {
        margin-top: 14px;
        font-size: 0.95rem;
      }

      .summary-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        margin-top: 20px;
      }

      .summary-card {
        padding: 16px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.56);
        border: 1px solid rgba(125, 211, 252, 0.14);
      }

      .summary-card strong {
        display: block;
        font-size: 1.7rem;
        margin-top: 8px;
      }

      .toolbar {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(180px, 1fr));
      }

      .panel {
        padding: 18px;
        margin-bottom: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      input[type="search"],
      select {
        width: 100%;
        padding: 12px 14px;
        outline: none;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 28px;
      }

      .toggle-row input {
        accent-color: var(--accent-strong);
      }

      .results-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .store-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .store-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--tag);
        border: 1px solid var(--tag-border);
        color: var(--muted);
      }

      .games-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }

      .game-card {
        overflow: hidden;
      }

      .cover {
        aspect-ratio: 16 / 9;
        background:
          linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(34, 197, 94, 0.12)),
          rgba(15, 23, 42, 0.7);
      }

      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-body {
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      .card-title {
        display: grid;
        gap: 6px;
      }

      .card-title small,
      .subtitle,
      .empty-state,
      .error-state {
        color: var(--muted);
      }

      .tag-list,
      .action-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tag {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.82rem;
        background: var(--tag);
        border: 1px solid var(--tag-border);
      }

      .tag.success {
        color: var(--success);
        border-color: rgba(134, 239, 172, 0.32);
      }

      .tag.warning {
        color: var(--warning);
        border-color: rgba(251, 191, 36, 0.32);
      }

      .action-row a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 12px;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid var(--panel-border);
        background: linear-gradient(
          135deg,
          var(--accent-soft),
          var(--accent-soft-strong)
        );
      }

      .empty-state,
      .error-state {
        padding: 18px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.68);
        border: 1px dashed var(--panel-border);
      }

      @media (max-width: 1100px) {
        .toolbar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 720px) {
        main {
          padding: 16px;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }

        .toggle-row {
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero-header">
          <div>
            <h1>GeForce NOW x PC Game Pass catalog</h1>
            <p>
              Browse the games currently present in both the GeForce NOW
              catalog and Xbox PC Game Pass.
            </p>
          </div>
          <a class="pill-link" href="./index.html">
            Instant Gaming tracker
          </a>
        </div>
        <p class="meta" id="generated-at">Loading catalog snapshot...</p>
        <div class="summary-grid" id="summary"></div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <div class="field">
            <label for="search">Search</label>
            <input
              id="search"
              type="search"
              placeholder="Search title, publisher, developer, or store"
            />
          </div>
          <div class="field">
            <label for="store-filter">GFN store</label>
            <select id="store-filter"></select>
          </div>
          <div class="field">
            <label for="sort-order">Sort</label>
            <select id="sort-order">
              <option value="title">Title A-Z</option>
              <option value="publisher">Publisher A-Z</option>
              <option value="release">Newest release</option>
            </select>
          </div>
          <label class="toggle-row" for="xbox-store-only">
            <input id="xbox-store-only" type="checkbox" />
            <span>Only games with a GFN Xbox store option</span>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="results-header">
          <div>
            <h2>Catalog</h2>
            <p id="results-meta">Loading games...</p>
          </div>
          <div class="store-pills" id="store-pills"></div>
        </div>
        <div class="games-grid" id="games"></div>
      </section>
    </main>

    <script>
      const DATA_URL = "./data/gfn-xbox-pc-game-pass-catalog.json";

      let catalogData = null;

      function formatTimestamp(value) {
        return new Date(value).toLocaleString();
      }

      function formatDate(value) {
        if (!value) {
          return "Unknown release date";
        }

        return new Date(value).toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric"
        });
      }

      function normalizeText(value) {
        return String(value || "").toLowerCase();
      }

      function renderGeneratedAt() {
        const generatedAt = document.getElementById("generated-at");

        if (!catalogData) {
          generatedAt.textContent = "The catalog data is not available yet.";
          return;
        }

        generatedAt.textContent =
          "Last update: " +
          formatTimestamp(catalogData.generated_at) +
          " · GFN " +
          catalogData.gfn_country +
          " / Xbox " +
          catalogData.xbox_market;
      }

      function renderSummary() {
        const summary = document.getElementById("summary");
        const counts = catalogData.counts;
        const details = catalogData.summary;

        const cards = [
          ["Intersection titles", counts.intersection_titles],
          ["GFN catalog", counts.gfn_titles],
          ["PC Game Pass titles", counts.xbox_pc_titles],
          ["GFN Xbox store", details.gfn_xbox_store_matches]
        ];

        summary.innerHTML = cards
          .map(
            ([label, value]) => `
              <article class="summary-card">
                <p>${label}</p>
                <strong>${value}</strong>
              </article>
            `
          )
          .join("");
      }

      function renderStoreFilter() {
        const select = document.getElementById("store-filter");
        const stores = Object.keys(catalogData.summary.store_counts || {});

        select.innerHTML = [
          '<option value="all">All GFN stores</option>',
          ...stores.map(
            (store) => `<option value="${store}">${store}</option>`
          )
        ].join("");
      }

      function renderStorePills() {
        const pills = document.getElementById("store-pills");
        const storeCounts = catalogData.summary.store_counts || {};

        pills.innerHTML = Object.entries(storeCounts)
          .map(
            ([store, count]) =>
              `<span class="store-pill">${store}<strong>${count}</strong></span>`
          )
          .join("");
      }

      function getFilteredGames() {
        const searchValue = normalizeText(
          document.getElementById("search").value
        );
        const storeFilter =
          document.getElementById("store-filter").value || "all";
        const xboxStoreOnly =
          document.getElementById("xbox-store-only").checked;
        const sortOrder =
          document.getElementById("sort-order").value || "title";

        let games = (catalogData.games || []).filter((game) => {
          if (
            storeFilter !== "all" &&
            !game.gfn_stores.includes(storeFilter)
          ) {
            return false;
          }

          if (xboxStoreOnly && !game.gfn_has_xbox_store) {
            return false;
          }

          if (!searchValue) {
            return true;
          }

          const haystack = [
            game.title,
            game.xbox_title,
            game.publisher,
            game.developer,
            game.gfn_stores.join(" ")
          ]
            .filter(Boolean)
            .join(" ");

          return normalizeText(haystack).includes(searchValue);
        });

        games.sort((left, right) => {
          if (sortOrder === "release") {
            return (
              new Date(right.release_date || 0).getTime() -
              new Date(left.release_date || 0).getTime()
            );
          }

          if (sortOrder === "publisher") {
            return (left.publisher || left.title).localeCompare(
              right.publisher || right.title
            );
          }

          return left.title.localeCompare(right.title);
        });

        return games;
      }

      function renderGames() {
        const games = getFilteredGames();
        const gamesRoot = document.getElementById("games");
        const resultsMeta = document.getElementById("results-meta");

        resultsMeta.textContent =
          "Showing " +
          games.length +
          " of " +
          catalogData.counts.intersection_titles +
          " overlapping titles.";

        if (!games.length) {
          gamesRoot.innerHTML =
            '<div class="empty-state">No games match the current filters.</div>';
          return;
        }

        gamesRoot.innerHTML = games
          .map((game) => {
            const subtitle =
              game.xbox_title && game.xbox_title !== game.title
                ? `<small>${game.xbox_title}</small>`
                : "";

            const description = game.description
              ? `<p class="subtitle">${game.description}</p>`
              : "";

            const image = game.image_url
              ? `<img src="${game.image_url}" alt="${game.title}" loading="lazy" />`
              : "";

            const xboxStoreTag = game.gfn_has_xbox_store
              ? '<span class="tag success">GFN Xbox store</span>'
              : '<span class="tag warning">No GFN Xbox store</span>';

            const publisher = game.publisher
              ? `<p>Publisher: ${game.publisher}</p>`
              : "";
            const developer = game.developer
              ? `<p>Developer: ${game.developer}</p>`
              : "";

            return `
              <article class="game-card">
                <div class="cover">${image}</div>
                <div class="card-body">
                  <div class="card-title">
                    <h3>${game.title}</h3>
                    ${subtitle}
                  </div>
                  ${description}
                  <div class="tag-list">
                    ${xboxStoreTag}
                    ${game.gfn_stores
                      .map((store) => `<span class="tag">${store}</span>`)
                      .join("")}
                  </div>
                  <div class="subtitle">
                    ${publisher}
                    ${developer}
                    <p>Release date: ${formatDate(game.release_date)}</p>
                  </div>
                  <div class="action-row">
                    <a href="${game.xbox_url}" target="_blank" rel="noreferrer">
                      Open Microsoft Store
                    </a>
                  </div>
                </div>
              </article>
            `;
          })
          .join("");
      }

      async function loadCatalogData() {
        const response = await fetch(DATA_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            `Failed to load catalog data: ${response.status}`
          );
        }

        return response.json();
      }

      async function init() {
        try {
          catalogData = await loadCatalogData();
          renderGeneratedAt();
          renderSummary();
          renderStoreFilter();
          renderStorePills();
          renderGames();

          [
            "search",
            "store-filter",
            "sort-order",
            "xbox-store-only"
          ].forEach((id) => {
            document
              .getElementById(id)
              .addEventListener("input", renderGames);
            document
              .getElementById(id)
              .addEventListener("change", renderGames);
          });
        } catch (error) {
          document.getElementById("generated-at").textContent =
            "The catalog data is not available yet.";
          document.getElementById("summary").innerHTML = "";
          document.getElementById("games").innerHTML =
            `<div class="error-state">${error.message}</div>`;
          document.getElementById("results-meta").textContent =
            "Unable to render the catalog.";
        }
      }

      init();
    </script>
  </body>
</html>
